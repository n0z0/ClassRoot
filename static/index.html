<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ClassRoot - Enterprise Meeting Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="ClassRoot Enterprise Interactive WebRTC Meeting & Video Conferencing Portal">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="/mainpage.css">
  </head>

  <body>
    <div class="home">
      <div class="brand-header">
        <div class="brand-badge">WebRTC Secure Media Node</div>
        <h1 id="title" class="navbar-brand">ClassRoot</h1>
        <p class="brand-subtitle">Enterprise Interactive Communication & Meeting Portal</p>
      </div>

      <form id="groupform">
        <label for="group">Nama Ruangan (Meeting Room):</label>
        <div class="form-group-wrapper">
          <input id="group" type="text" name="group" placeholder="contoh: public atau it-briefing" autofocus required />
          <input id="submitbutton" type="submit" value="Masuk Room" />
        </div>
      </form>

      <p id="errormessage"></p>

      <div id="public-groups" class="groups">
        <h2>Daftar Ruang Pertemuan Terbuka</h2>
        <table id="public-groups-table"></table>
      </div>
    </div>

    <footer class="signature">
      <p><a href="/">ClassRoot</a> &mdash; WebRTC Media Portal &bull; PWA Enabled</p>
    </footer>

    <script>
      // Registrasi PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="/mainpage.js" defer></script>
    <script src="/cti-telemetry.js" defer></script>
  </body>
</html>
